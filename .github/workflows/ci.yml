name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARD_PROVIDER: demo
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Python compile
        run: python -m compileall -q app tests
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Tests
        run: python -m pytest -q
      - name: Install browser tests
        run: npm ci
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Browser flows
        run: npm run test:browser
      - name: Windows one-command startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-start.ps1
      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-${{ matrix.os }}
          path: test-results/
