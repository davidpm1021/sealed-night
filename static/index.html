<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prerelease Night</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="brand" class="brand" type="button">PRERELEASE <span>NIGHT</span></button>
      <div id="statusPill" class="status-pill">Local MVP</div>
    </header>

    <main id="app" class="main"></main>
  </div>

  <template id="cardTemplate">
    <button class="card" type="button">
      <div class="card-art-wrap">
        <img class="card-art" alt="" loading="lazy" />
        <div class="card-placeholder">
          <strong class="card-placeholder-name"></strong>
          <span class="card-placeholder-type"></span>
          <span class="card-placeholder-text"></span>
        </div>
        <span class="foil-badge">FOIL</span>
      </div>
      <div class="card-meta">
        <strong class="card-name"></strong>
        <span class="card-cost"></span>
      </div>
      <div class="card-type"></div>
    </button>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
